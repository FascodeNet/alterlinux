LABEL arch_nbd
TEXT HELP
Boot the %ALTERISO_OS_NAME% install medium using NBD.
It allows you to install %ALTERISO_OS_NAME% or perform system maintenance.
ENDTEXT
MENU LABEL %ALTERISO_OS_NAME% install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cow_spacesize=%ALTERISO_COW_SPACESIZE% cms_verify=y %ALTERISO_KERNEL_PARAM%
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
Boot the %ALTERISO_OS_NAME% live medium using NFS.
It allows you to install %ALTERISO_OS_NAME% or perform system maintenance.
ENDTEXT
MENU LABEL %ALTERISO_OS_NAME% install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cow_spacesize=%ALTERISO_COW_SPACESIZE% cms_verify=y %ALTERISO_KERNEL_PARAM%
SYSAPPEND 3

LABEL arch_http
TEXT HELP
