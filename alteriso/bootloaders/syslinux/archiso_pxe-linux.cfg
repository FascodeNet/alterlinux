INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=http://${pxeserver}/ cow_spacesize=%ALTERISO_COW_SPACESIZE% cms_verify=y %ALTERISO_KERNEL_PARAM%
SYSAPPEND 3
