# AlterISO5のビルドを行うGithub Actions

name: build AlterISO5

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build Dockerfile
        run: docker build -t alteriso5 alteriso

      - name: Run Dockerfile
        run: docker run --privileged --rm -w /mnt -v $(pwd):/mnt alteriso5 alteriso profile build /usr/share/alteriso/configs/xfce

      # TODO: アーティファクトをアップロードする機能の実装
