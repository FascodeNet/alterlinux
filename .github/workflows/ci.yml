# AlterISO5のビルドを行うGithub Actions

name: build AlterISO5

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  # ISOを焼かずに済む検証。プロファイルとvariantの全組み合わせはここで見る
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build the Go toolchain image
        run: docker build --target golang-dev -t alteriso-dev alteriso

      - name: Run tests
        run: docker run --rm -w /mnt -v $(pwd)/alteriso:/mnt alteriso-dev go test ./src/...

      - name: Build Dockerfile
        run: docker build --build-arg GIT_REVISION="${{ github.sha }}" -t alteriso5 alteriso

      - name: Check that every package list resolves
        run: docker run --rm -w /mnt -v $(pwd)/alteriso:/mnt alteriso5 alteriso profile check --modules ./modules --bootloaders ./bootloaders --configs ./configs

  build:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Build Dockerfile
        run: docker build --build-arg GIT_REVISION="${{ github.sha }}" -t alteriso5 alteriso

      - name: Run Dockerfile
        run: docker run --privileged --rm -w /mnt -v $(pwd):/mnt alteriso5 alteriso profile --noconfirm build /usr/share/alteriso/configs/xfce

      # TODO: アーティファクトをアップロードする機能の実装
